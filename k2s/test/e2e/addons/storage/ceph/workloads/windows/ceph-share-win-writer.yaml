apiVersion: v1
kind: Pod
metadata:
  name: ceph-share-win-writer
  namespace: ceph-share-test
  labels:
    app: ceph-share-win-writer
spec:
  nodeSelector:
    kubernetes.io/os: windows
  tolerations:
    - key: OS
      operator: Exists
      effect: NoSchedule
    - key: os
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.io/os
      operator: Exists
      effect: NoSchedule
  containers:
    - name: writer
      image: mcr.microsoft.com/windows/nanoserver:ltsc2022
      command:
        - powershell.exe
        - -Command
        - >-
          Set-Content -Path C:\data\win-hello.txt -Value 'hello from k2s ceph windows e2e';
          while ($true) { Start-Sleep -Seconds 30 }
      volumeMounts:
        - name: ceph-data
          mountPath: 'C:\data'
  volumes:
    - name: ceph-data
      hostPath:
        path: 'C:\k8s-ceph-share'
        type: Directory
