apiVersion: v1
kind: AddonManifest
metadata:
  name: storage
  description: Persistent storage solutions
spec:
  implementations:
    - name: smb
      description: StorageClass provisioning based on SMB share between K8s nodes (Windows/Linux)
      offline_usage:
        linux:
          repos: []
          deb:
            - cifs-utils
            - samba
          curl: []
          additionalImages: []
        windows:
          curl: []
      commands:
        enable:
          cli:
            flags:
              - name: smbHostType
                shorthand: t
                default: windows
                description: SMB host type
                constraints:
                  kind: validation-set
                  validationSet:
                    - windows
                    - linux
            examples:
              - cmd: k2s addons enable storage smb
                comment: Creates SMB share(s) between K8s nodes and Windows host system according to config in 'addons/storage/smb/config'
          script:
            subPath: smb/Enable.ps1
            parameterMappings:
              - cliFlagName: smbHostType
                scriptParameterName: SmbHostType
        disable:
          cli:
            flags:
              - name: force
                shorthand: f
                default: false
                description: Disable the addon and DELETE ALL DATA without user confirmation
                exclusionGroup: data-retention
              - name: keep
                shorthand: k
                default: false
                description: Disable the addon and KEEP ALL DATA without user confirmation
                exclusionGroup: data-retention
            examples:
              - cmd: k2s addons disable storage smb
                comment: Removes SMB share(s) between K8s nodes and prompts for data retention/deletion
              - cmd: k2s addons disable storage smb -f
                comment: Removes SMB share(s) between K8s nodes and DELETES ALL DATA without prompting for confirmation
              - cmd: k2s addons disable storage smb -k
                comment: Removes SMB share(s) between K8s nodes and KEEPS ALL DATA without prompting for confirmation
          script:
            subPath: smb/Disable.ps1
            parameterMappings:
              - cliFlagName: force
                scriptParameterName: Force
              - cliFlagName: keep
                scriptParameterName: Keep
    - name: ceph
      description: Experimental - Ceph CSI operator for CephFS (file) storage provisioning
      offline_usage:
        linux:
          repos: []
          deb:
            - podman
            - gnupg
            - ca-certificates
            - curl
            - lsb-release
            - lvm2
          curl:
            # cephadm bootstrap binary (Ceph v20 / Tentacle). Downloaded during export and
            # staged into the addon storage folder so cluster bootstrap works fully offline.
            - url: https://download.ceph.com/rpm-20.2.3/el10/noarch/cephadm
              destination: cephadm
          additionalImages:
            - quay.io/ceph/ceph:v20.2.3
            - quay.io/cephcsi/ceph-csi-operator:v1.0.4
            - quay.io/cephcsi/cephcsi:v3.17.0
            - registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
            - registry.k8s.io/sig-storage/csi-attacher:v4.12.0
            - registry.k8s.io/sig-storage/csi-resizer:v2.1.0
            - registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
            - registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
            - registry.k8s.io/sig-storage/livenessprobe:v2.18.0
            - registry.k8s.io/sig-storage/smbplugin:v1.20.1
            - shsk2s.azurecr.io/sig-storage/smbplugin:v1.20.1-hp
            - shsk2s.azurecr.io/sig-storage/csi-node-driver-registrar:v2.17.0-hp
            - quay.io/samba.org/samba-metrics:ceph20-centos-amd64
            - quay.io/samba.org/samba-server:ceph20-centos-amd64
          additionalImagesFiles:
            - manifests/operator.yaml
            - manifests/csi-rbac.yaml
        windows:
          curl: []
      commands:
        enable:
          cli:
            flags:
              - name: setupWindowsNode
                shorthand: w
                default: false
                description: Configure Ceph SMB access (mgr/smb + SMB CSI) so Windows pods can consume CephFS
            examples:
              - cmd: k2s addons enable storage ceph
                comment: Enables experimental Ceph CSI CephFS storage provisioning using config in 'addons/storage/ceph/config'
              - cmd: k2s addons enable storage ceph -w
                comment: Enables Ceph CSI and additionally exports CephFS over SMB (Ceph mgr/smb) with the SMB CSI driver so Windows pods can consume CephFS
          script:
            subPath: ceph/Enable.ps1
            parameterMappings:
              - cliFlagName: monitorEndpoints
                scriptParameterName: MonitorEndpoints
              - cliFlagName: adminKey
                scriptParameterName: AdminKey
              - cliFlagName: cephfsPool
                scriptParameterName: CephfsPool
              - cliFlagName: setupWindowsNode
                scriptParameterName: SetupWindowsNode
        disable:
          cli:
            flags:
              - name: force
                shorthand: f
                default: false
                description: Disable the addon and DELETE ALL PERSISTENTVOLUMES without user confirmation
            examples:
              - cmd: k2s addons disable storage ceph
                comment: Removes Ceph CSI provisioners and prompts for data deletion
              - cmd: k2s addons disable storage ceph -f
                comment: Removes Ceph CSI provisioners and DELETES ALL DATA without prompting
          script:
            subPath: ceph/Disable.ps1
            parameterMappings:
              - cliFlagName: force
                scriptParameterName: Force
        status:
          script:
            subPath: ceph/Get-Status.ps1