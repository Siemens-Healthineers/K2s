apiVersion: v1
kind: PersistentVolume
metadata:
  name: orthanc-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/k8s-smb-share/dicom"
