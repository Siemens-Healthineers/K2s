apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dicom
resources:
  - dicom-namespace.yaml
  - dicom-pv.yaml
  - dicom-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - dicom-deployment.yaml
  - dicom-service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: json-configmap
    files:
      - orthanc.json
