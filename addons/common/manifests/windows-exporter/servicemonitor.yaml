apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: windows-exporter
  namespace: monitoring
  labels:
    app: windows-exporter
    release: kube-prometheus-stack
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: windows-exporter
  namespaceSelector:
    matchNames:
    - kube-system
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
