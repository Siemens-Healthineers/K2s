apiVersion: v1
kind: PersistentVolume
metadata:
  name: registry-pv
  namespace: registry
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  local:
    path: /registry/repository
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - __STORAGE_NODE__
        - key: kubernetes.io/os
          operator: In
          values:
          - linux
