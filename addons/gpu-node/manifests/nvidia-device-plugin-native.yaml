# Native NVIDIA device plugin for external Linux workers. These nodes are
# provisioned with the NVIDIA Container Toolkit and a native CDI specification
# at /etc/cdi/nvidia.yaml when they are added to K2s.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    k8s-app: nvidia-device-plugin-native
  name: nvidia-device-plugin-native
  namespace: gpu-node
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      k8s-app: nvidia-device-plugin-native
  template:
    metadata:
      labels:
        k8s-app: nvidia-device-plugin-native
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.19.2
          imagePullPolicy: IfNotPresent
          name: nvidia-device-plugin-ctr
          args:
            - --device-list-strategy=cdi-annotations
            - --pass-device-specs=true
            - --fail-on-init-error=false
            - --cdi-annotation-prefix=cdi.k8s.io/
            - --config-file=/etc/nvidia/config.yaml
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
            # CDI strategy required for CRI-O to inject GPU device and driver mounts.
            - name: DEVICE_LIST_STRATEGY
              value: cdi-annotations
            - name: PASS_DEVICE_SPECS
              value: "true"
            - name: CDI_ANNOTATION_PREFIX
              value: cdi.k8s.io/
            # Debian installs NVML below the NVIDIA alternatives directory.
            - name: LD_LIBRARY_PATH
              value: /usr/lib/x86_64-linux-gnu/nvidia/current:/usr/lib/x86_64-linux-gnu
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            # The device plugin discovers the host NVIDIA driver from its
            # default container driver root, /driver-root.
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
            - name: nvidia-driver-libs
              mountPath: /usr/lib/x86_64-linux-gnu/nvidia/current
              readOnly: true
            - name: time-slicing-config
              mountPath: /etc/nvidia/config.yaml
              subPath: config.yaml
            - name: cdi-etc
              mountPath: /etc/cdi
              readOnly: true
            - name: cdi-run
              mountPath: /var/run/cdi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: driver-root
          hostPath:
            path: /
        - name: nvidia-driver-libs
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/nvidia/current
            type: Directory
        - name: time-slicing-config
          configMap:
            name: time-slicing-config
        - name: cdi-etc
          hostPath:
            path: /etc/cdi
            type: DirectoryOrCreate
        - name: cdi-run
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/os: linux
        gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist