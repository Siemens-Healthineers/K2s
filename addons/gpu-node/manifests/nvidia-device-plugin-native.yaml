# Native NVIDIA device plugin for external Linux workers. These nodes are
# provisioned with the NVIDIA Container Toolkit and a native CDI specification
# at /etc/cdi/nvidia.yaml when they are added to K2s.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    k8s-app: nvidia-device-plugin-native
  name: nvidia-device-plugin-native
  namespace: gpu-node
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      k8s-app: nvidia-device-plugin-native
  template:
    metadata:
      labels:
        k8s-app: nvidia-device-plugin-native
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.19.2
          imagePullPolicy: IfNotPresent
          name: nvidia-device-plugin-ctr
          args:
            - --config-file=/etc/nvidia/config.yaml
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
            # Some externally added workers expose their GPU through a
            # non-NVML path. CDI device-list strategies are rejected there.
            - name: DEVICE_LIST_STRATEGY
              value: envvar
            # Debian installs NVML below the NVIDIA alternatives directory.
            - name: LD_LIBRARY_PATH
              value: /usr/lib/x86_64-linux-gnu/nvidia/current
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            # The device plugin discovers the host NVIDIA driver from its
            # default container driver root, /driver-root.
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
            - name: nvidia-driver-libs
              mountPath: /usr/lib/x86_64-linux-gnu/nvidia/current
              readOnly: true
            - name: time-slicing-config
              mountPath: /etc/nvidia/config.yaml
              subPath: config.yaml
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: driver-root
          hostPath:
            path: /
        - name: nvidia-driver-libs
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/nvidia/current
            type: Directory
        - name: time-slicing-config
          configMap:
            name: time-slicing-config
      nodeSelector:
        kubernetes.io/os: linux
        gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist