apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

namespace: ingress-traefik

resources:
  - namespace.yaml
  - crds/traefik-crds.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - ingressclass.yaml
  - service.yaml


