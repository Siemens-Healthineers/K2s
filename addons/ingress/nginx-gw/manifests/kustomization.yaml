apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

namespace: nginx-gw

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - service.yaml
  - deployment.yaml
  - gatewayclass.yaml
  - nginxgateway.yaml
  - certs-role.yaml
  - certs-rolebinding.yaml
  - certs-job.yaml
