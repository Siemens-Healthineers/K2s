apiVersion: v1
kind: Pod
metadata:
  name: ceph-share-win-reader
  namespace: ceph-share-test
  labels:
    app: ceph-share-win-reader
spec:
  nodeSelector:
    kubernetes.io/os: windows
  tolerations:
    - key: OS
      operator: Exists
      effect: NoSchedule
    - key: os
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.io/os
      operator: Exists
      effect: NoSchedule
  containers:
    - name: reader
      image: mcr.microsoft.com/windows/nanoserver:ltsc2022
      command:
        - powershell.exe
        - -Command
        - >-
          while ($true) { Start-Sleep -Seconds 30 }
      volumeMounts:
        - name: ceph-data
          mountPath: 'C:\data'
  volumes:
    - name: ceph-data
      persistentVolumeClaim:
        claimName: ceph-share-win-pvc
