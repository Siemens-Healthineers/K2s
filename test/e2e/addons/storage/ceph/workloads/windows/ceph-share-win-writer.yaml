apiVersion: v1
kind: Pod
metadata:
  name: ceph-share-win-writer
  namespace: ceph-share-test
  labels:
    app: ceph-share-win-writer
spec:
  nodeSelector:
    kubernetes.io/os: windows
  tolerations:
    - key: OS
      operator: Exists
      effect: NoSchedule
    - key: os
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.io/os
      operator: Exists
      effect: NoSchedule
  containers:
    - name: writer
      image: mcr.microsoft.com/windows/nanoserver:ltsc2022
      command:
        - cmd.exe
        - /c
        - >-
          echo hello from k2s ceph windows e2e > C:\data\win-hello.txt && ping -t 127.0.0.1 > NUL
      volumeMounts:
        - name: ceph-data
          mountPath: 'C:\data'
  volumes:
    - name: ceph-data
      persistentVolumeClaim:
        claimName: ceph-share-win-pvc
